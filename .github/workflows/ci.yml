name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ====================================================================
  # 1. BACKEND TEST SUITE (FastAPI + Pytest)
  # ====================================================================
  backend-test:
    name: Backend Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Seed SQLite Database
        run: |
          cd backend
          python -c "from app.database import Base, engine, SessionLocal; from app.seed import seed_database; Base.metadata.create_all(bind=engine); db = SessionLocal(); seed_database(db, force=True)"

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest tests/ -v

  # ====================================================================
  # 2. FRONTEND TEST & BUILD (Angular 21 + Vitest + Production Build)
  # ====================================================================
  frontend-test-and-build:
    name: Frontend Tests & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Node Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Vitest Specs
        run: |
          cd frontend
          npm test -- --watch=false

      - name: Run Angular Production Build
        run: |
          cd frontend
          npm run build

  # ====================================================================
  # 3. PIPELINE STATUS SUMMARY
  # ====================================================================
  ci-status:
    name: CI Pipeline Status
    needs: [backend-test, frontend-test-and-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Verify All CI Checks Passed
        run: |
          if [ "${{ needs.backend-test.result }}" != "success" ] || [ "${{ needs.frontend-test-and-build.result }}" != "success" ]; then
            echo "❌ CI Pipeline Failed. Check individual job logs above."
            exit 1
          fi
          echo "✅ All Backend & Frontend CI Checks Passed Successfully!"
