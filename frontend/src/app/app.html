<div [dir]="isRtl() ? 'rtl' : 'ltr'" class="min-h-screen bg-slate-50 text-slate-900 flex flex-col font-sans selection:bg-amber-400 selection:text-slate-950 overflow-x-hidden w-full max-w-full">
  <!-- Top Navigation Bar & Utility Header -->
  <app-header />

  <!-- Main Corporate Content Flow -->
  <main class="flex-1 w-full max-w-full overflow-x-hidden">
    <!-- Hero Section with 3-Tab Action Engine (Intact with all animations) -->
    <app-hero-search />

    <!-- Interactive Scroll-Driven Maritime Journey (4 Full-Height Waypoints, SVG Route, Path-Following Ship, HUD) -->
    <app-maritime-journey />

    <!-- Interactive Leaflet Trade Route & Live Vessel Map -->
    <app-map />

    <!-- Fleet Directory & 16-Spec Technical Modal -->
    <app-fleet />

    <!-- Sustainability & Green Feeder Highlight -->
    <app-sustainability />

    <!-- Regional Offices & Port Agents Directory -->
    <app-agents />
  </main>

  <!-- Global Modals -->
  <app-vessel-modal />
  <app-booking-modal />

  <!-- Corporate Footer -->
  <app-footer />
</div>
