<div [dir]="isRtl() ? 'rtl' : 'ltr'" class="min-h-screen bg-white text-slate-900 flex flex-col font-sans selection:bg-[#df0003] selection:text-white overflow-x-hidden w-full max-w-full">
  <!-- Top Navigation Bar & Utility Header -->
  <app-header />

  <!-- Main Corporate Content Flow (Unified Clean White & Light Theme) -->
  <main class="flex-1 w-full max-w-full overflow-x-hidden bg-white">
    <!-- Hero Section with Looping Crossing Vessel Video & 3-Tab Action Console -->
    <app-hero-search />

    <!-- Corporate Core Showcase: Highlights, About Us, Explore Services, Ports Covered, Why Choose Us, Enquiries CTA, Memberships -->
    <app-sustainability />

    <!-- Interactive Leaflet Trade Corridor & Regional Route Geonavigator -->
    <app-map />

    <!-- Regional Offices & Dedicated Agents Directory -->
    <app-agents />

    <!-- Corporate Footer -->
    <app-footer />
  </main>

  <!-- Global Commercial Booking Modal -->
  <app-booking-modal />
</div>
