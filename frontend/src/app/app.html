<div [dir]="isRtl() ? 'rtl' : 'ltr'" class="min-h-screen bg-navy-950 text-slate-100 flex flex-col font-sans selection:bg-ocean-500 selection:text-navy-950">
  <!-- Top Navigation Bar & Utility Header -->
  <app-header />

  <!-- Main Corporate Content Flow -->
  <main class="flex-1">
    <!-- Hero Section with 3-Tab Action Engine -->
    <app-hero-search />

    <!-- Global KPI Counter Strip -->
    <app-stats-strip />

    <!-- Feeder Routes & Services Summary -->
    <app-services-list />

    <!-- Interactive Leaflet Trade Route & Live Vessel Map -->
    <app-map />

    <!-- Fleet Directory & 16-Spec Technical Modal -->
    <app-fleet />

    <!-- Sustainability & Green Feeder Highlight -->
    <app-sustainability />

    <!-- Regional Offices & Port Agents Directory -->
    <app-agents />
  </main>

  <!-- Global Modals -->
  <app-vessel-modal />
  <app-booking-modal />

  <!-- Corporate Footer -->
  <app-footer />
</div>
